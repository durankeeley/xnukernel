# What differs between the macOS versions for the common builder (scripts/xnu-make.sh, bootstrap.sh). Sourced by those scripts.
XCROSS_VERSION=tahoe
XCROSS_SDKVER=26.0                       # SDKVERSION for XNU's makefiles, also selects the Darwin 25 compiler target
HOST_OS_VERSION=26.0
RC_DARWIN_KERNEL_VERSION_DEFAULT=25.5.0
# kernelmanagerd picks SystemKernelExtensions.kc.<variant> from the kernel version string: report DEVELOPMENT so the stock
# kernel keeps the unsuffixed collections
KERNEL_BUILD_OBJROOT_DEFAULT=xnu_development-xcross/DEVELOPMENT_X86_64
MAKE_EXTRA='PLUTIL=$T/bin/noop PYTHON=$(command -v python3)'
XNU_OBJ_DEFAULT=xnu-tahoe                # build/<name>

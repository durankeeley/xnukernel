# Profile for scripts/make-install-disk.sh: macOS 10.13.6 High Sierra (xnu-4570). Plain shell variables.
# KIND selects the layout the guest builder uses:
#   basesystem-packages   the classic one-stick install: BaseSystem copied to one HFS+ volume, OS packages in System/Installation/Packages,
#                         OpenCore on the EFI partition. Works for 10.11 to 10.13 (HFS+ installers with an InstallESD.dmg).
KIND=basesystem-packages
NAME=highsierra
# Apple's installer files (from gibMacOS): BaseSystem.dmg, BaseSystem.chunklist, InstallESD.dmg (the payload inside InstallESDDmg.pkg),
# AppleDiagnostics.dmg, AppleDiagnostics.chunklist, InstallInfo.plist
INSTALLER_DIR=${INSTALLER_DIR:-$HOME/Downloads/highsierra-dl}
ESD_DMG=${ESD_DMG:-$INSTALLER_DIR/x/InstallESD.dmg}
# full set of kexts (321 for 10.13.6), unpacked from Core.pkg by scripts/extract-extensions.sh. The installer's own copy is stripped.
EXTENSIONS_DIR=${EXTENSIONS_DIR:-$HOME/Downloads/hs-exts/System/Library/Extensions}
KERNEL=${KERNEL:-build/xnu-k8/obj/RELEASE_X86_64/kernel.unstripped}
KCSUFFIX=xcross                       # boot-arg kcsuffix=: kernel.<suffix> and prelinkedkernel.<suffix> are picked from the volume
BOOTARGS="-v keepsyms=1 kcsuffix=xcross"
CSR=0x7f                              # SIP off, the kernel is not signed by Apple
DISK_SIZE=11G                         # 4.8 GB of packages + the BaseSystem + room
VOLNAME=USB
# the Recovery that builds the disk (any working installer): how to reach its Terminal from the keyboard
BOOTSTRAP_BASE=${BOOTSTRAP_BASE:-$HOME/Downloads/OSX-KVM/BaseSystem-hs.img}
PICKER_KEYS=${PICKER_KEYS:-"right ret"}               # OpenCore picker: EFI, OS X Base System
TERMINAL_KEYS="ctrl-f2 right right right right down down down down ret"    # menu bar: Utilities > Terminal
